<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>퍼펙트문해 최종 투표 결과</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function() {
            if (localStorage.getItem('hasVotedFinals') === 'true') {
                alert('투표를 완료하신 분은 실시간 현황을 보실 수 없습니다.\n최종 결과 발표를 기다려주세요!');
                window.location.href = 'index.html';
            }
        })();
    </script>
    <style>
        :root {
            --primary: #2563EB;
            --primary-light: #60A5FA;
            --primary-dark: #1E40AF;
            --final-gold: #F59E0B;
            --final-gold-light: #FFF7ED;
            --bg-start: #F8FAFC;
            --bg-end: #F1F5F9;
            --card-bg: #FFFFFF;
            --card-border: rgba(37, 99, 235, 0.1);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --shadow-md: 0 8px 32px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 16px 48px rgba(15, 23, 42, 0.08);
            --radius: 20px;
            --radius-sm: 14px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding-bottom: 40px;
        }

        .app-container {
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 20px;
            animation: fadeUp 0.5s ease both;
        }

        .header-hero {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 8px;
        }

        .header-character {
            width: 150px;
            height: 150px;
            flex-shrink: 0;
        }

        .header-character img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-center {
            text-align: center;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.1);
            color: var(--final-gold);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        @media (max-width: 520px) {
            .header-character {
                width: 100px;
                height: 100px;
            }
            .header-hero {
                gap: 8px;
            }
        }

        .header-badge svg { width: 14px; height: 14px; }

        h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--final-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

        /* Section Title */
        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .section-title .icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(245, 158, 11, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Summary Cards */
        .summary-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
            animation: fadeUp 0.5s ease 0.1s both;
        }

        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 20px 16px;
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        .summary-card .label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-card .value {
            font-size: 28px;
            font-weight: 800;
            color: var(--final-gold);
        }

        .summary-card .value small {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Result Section */
        .result-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px 20px;
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
            animation: fadeUp 0.5s ease both;
        }

        /* Result Item */
        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }

        .result-item:last-child { border-bottom: none; }

        .result-rank {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            flex-shrink: 0;
            background: rgba(245, 158, 11, 0.08);
            color: var(--final-gold);
        }

        .result-item:nth-child(1) .result-rank {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            box-shadow: 0 2px 8px rgba(255, 165, 0, 0.3);
        }

        .result-item:nth-child(2) .result-rank {
            background: linear-gradient(135deg, #C0C0C0, #A0A0A0);
            color: white;
        }

        .result-item:nth-child(3) .result-rank {
            background: linear-gradient(135deg, #CD7F32, #A0522D);
            color: white;
        }

        .result-body { flex: 1; min-width: 0; }

        .result-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-bar-wrap {
            width: 100%;
            height: 8px;
            background: rgba(245, 158, 11, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .result-bar {
            height: 100%;
            border-radius: 4px;
            width: 0%;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--final-gold);
        }

        .result-votes {
            font-size: 14px;
            font-weight: 800;
            color: var(--final-gold);
            flex-shrink: 0;
            min-width: 44px;
            text-align: right;
        }

        .result-votes small {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Crown for 1st */
        .result-item:first-child .result-name::before {
            content: '🥇 ';
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 32px 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .empty-state .icon { font-size: 36px; margin-bottom: 12px; }

        /* Refresh Button */
        .refresh-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--final-gold) 0%, #D97706 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.25);
            transition: all var(--transition);
            margin-top: 8px;
            font-family: inherit;
        }

        .refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(245, 158, 11, 0.35); }
        .refresh-btn:active { transform: scale(0.98); }
        .refresh-btn svg { width: 18px; height: 18px; }

        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            margin-top: 20px;
            transition: color var(--transition);
        }

        .back-link:hover { color: var(--final-gold); }
        .back-link svg { width: 16px; height: 16px; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px 0 8px;
            color: var(--text-muted);
            font-size: 12px;
            animation: fadeUp 0.5s ease 0.35s both;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="header-hero">
                <div class="header-character">
                    <img src="img/cha_01.png" alt="캐릭터">
                </div>
                <div class="header-center">
                    <div class="header-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        GRAND FINAL RESULTS
                    </div>
                    <h1>최종 투표 결과</h1>
                    <p class="subtitle">영광의 주인공은 누구일까요?</p>
                </div>
                <div class="header-character">
                    <img src="img/cha_02.png" alt="캐릭터">
                </div>
            </div>
        </header>

        <!-- Summary -->
        <div class="summary-row">
            <div class="summary-card">
                <div class="label">최종 투표 수</div>
                <div class="value" id="totalSubmission">0<small>표</small></div>
            </div>
            <div class="summary-card">
                <div class="label">결선 진출 곡</div>
                <div class="value" id="totalSongs">0<small>곡</small></div>
            </div>
        </div>

        <!-- Super Final Banner -->
        <div style="background: linear-gradient(135deg, #6366F1, #EC4899); border-radius: var(--radius); padding: 24px; margin-bottom: 28px; text-align: center; color: white; box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25); animation: fadeUp 0.5s ease both;">
            <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; background: rgba(255,255,255,0.2); display: inline-block; padding: 2px 8px; border-radius: 4px;">Tie Breaker Round</div>
            <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px;">공동 1위 발생! 슈퍼 파이널 실시</h2>
            <p style="font-size: 14px; opacity: 0.9; margin-bottom: 24px; line-height: 1.5;">영광의 1등을 가리기 위해<br>상위 2곡을 대상으로 최종 투표를 진행합니다.</p>
            <a href="last_vote.html" style="display: inline-block; background: white; color: #6366F1; padding: 14px 40px; border-radius: 50px; font-weight: 800; text-decoration: none; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: 0.3s; transform: translateZ(0);">최종 투표하러 가기 &gt;</a>
        </div>

        <!-- Result Section -->
        <div id="resultSection"></div>

        <!-- Refresh -->
        <button class="refresh-btn" onclick="loadAll()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            새로고침
        </button>

        <div style="text-align:center; margin-top: 20px;">
            <a href="results.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                예선 결과 보기
            </a>
</div>

        <div class="footer">
            <p>© 2026 Perfect Literacy. All rights reserved.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://biibtfdpchcdlpfimimh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_yDCKYS2CXf3-WGzgpJ_pQA_pTF_p68p';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false, detectSessionInUrl: false }
        });

        async function loadAll() {
            const section = document.getElementById('resultSection');
            let submissions = [];
            let finalVotes = [];

            try {
                // 1. Fetch submissions and preliminary votes to identify finalists
                const [subsRes, prelimVotesRes, finalVotesRes] = await Promise.all([
                    supabaseClient.from('submissions').select('id, song_title'),
                    supabaseClient.from('votes').select('submission_id'),
                    supabaseClient.from('final_votes').select('submission_id')
                ]);

                if (subsRes.error) throw subsRes.error;
                if (prelimVotesRes.error) throw prelimVotesRes.error;
                if (finalVotesRes.error) throw finalVotesRes.error;

                const allSubmissions = subsRes.data;
                const prelimVotes = prelimVotesRes.data;
                finalVotes = finalVotesRes.data;

                // 2. Count prelim votes to get top 10
                const prelimCounts = {};
                prelimVotes.forEach(v => {
                    prelimCounts[v.submission_id] = (prelimCounts[v.submission_id] || 0) + 1;
                });

                const finalists = allSubmissions.map(s => ({
                    ...s,
                    prelimCount: prelimCounts[s.id] || 0
                })).sort((a, b) => b.prelimCount - a.prelimCount)
                .slice(0, 10);

                document.getElementById('totalSongs').innerHTML = finalists.length + '<small>곡</small>';

                // 3. Count final votes
                const finalCounts = {};
                finalVotes.forEach(v => {
                    finalCounts[v.submission_id] = (finalCounts[v.submission_id] || 0) + 1;
                });

                const total = finalVotes.length;
                document.getElementById('totalSubmission').innerHTML = total + '<small>표</small>';

                // 4. Render Finalists with final vote counts
                const items = finalists.map(s => ({
                    name: s.song_title,
                    count: finalCounts[s.id] || 0
                })).sort((a, b) => b.count - a.count);

                if (items.length > 0) {
                    section.innerHTML = '';
                    const card = buildSection('🏆 최종 투표 순위', items);
                    section.appendChild(card);
                } else {
                    section.innerHTML = '<div class="empty-state">최종 후보 데이터를 불러올 수 없습니다.</div>';
                }

            } catch (err) {
                console.error('Error loading results:', err);
                section.innerHTML = '<div class="empty-state">데이터를 불러오는 중 오류가 발생했습니다.</div>';
            }
        }

        function buildSection(title, items) {
            const div = document.createElement('div');
            div.className = 'result-section';

            let html = `<div class="section-title">${title}</div>`;

            if (items.length === 0) {
                html += `<div class="empty-state"><div class="icon">📭</div><p>아직 투표 데이터가 없습니다</p></div>`;
            } else {
                const maxCount = Math.max(...items.map(i => i.count), 1);
                items.forEach((item, idx) => {
                    const pct = (item.count / maxCount) * 100;
                    html += `
                    <div class="result-item">
                        <div class="result-rank">${idx + 1}</div>
                        <div class="result-body">
                            <div class="result-name">${item.name}</div>
                            <div class="result-bar-wrap">
                                <div class="result-bar" data-width="${Math.max(pct, 4)}"></div>
                            </div>
                        </div>
                        <div class="result-votes">${item.count}<small>표</small></div>
                    </div>`;
                });
            }

            div.innerHTML = html;

            // Animate bars
            requestAnimationFrame(() => {
                setTimeout(() => {
                    div.querySelectorAll('.result-bar').forEach(bar => {
                        bar.style.width = bar.dataset.width + '%';
                    });
                }, 100);
            });

            return div;
        }

        async function resetFinalVotes() {
            if (!confirm('정말로 모든 최종 투표 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없으며 모든 최종 투표 결과가 삭제됩니다.')) {
                return;
            }
            try {
                // Delete all rows from final_votes
                const { error } = await supabaseClient
                    .from('final_votes')
                    .delete()
                    .neq('id', '00000000-0000-0000-0000-000000000000'); // trick to delete all
                if (error) throw error;
                // Optionally clear any local storage related to final votes
                localStorage.removeItem('finalVotes');
                alert('서버 및 로컬 최종 투표 데이터가 초기화되었습니다.');
                loadAll();
            } catch (err) {
                console.error('Reset final votes error:', err);
                alert('최종 투표 데이터 초기화 중 오류가 발생했습니다. RLS 정책을 확인해주세요.');
            }
        }

        // Init
        loadAll();
    </script>
</body>
</html>
